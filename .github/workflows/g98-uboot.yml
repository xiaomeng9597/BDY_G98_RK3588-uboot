name: BDY G98 Uboot Build

on:
  push:
    branches:
      - kdev
  repository_dispatch:
  workflow_dispatch:

env:
  TZ: America/New_York
  ACTIONS_STEP_DEBUG: true

jobs:
  build-uboot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        id: basic_info
        run: |
          nproc
          uname -a
          cat /etc/*release
          free -h
          mount
          df -h
          cat /proc/cpuinfo
          cat /proc/meminfo

      - name: Create simulated physical disk
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}"G /mnt/mnt.img
          sudo truncate -s "${root_size}"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner.runner /builder
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler zip
          df -Th

      - name: Run UBoot Build in Ubuntu 22.04 container
        working-directory: /builder
        run: |
          pwd
          sudo /bin/cp -a ${{ github.workspace }}/* .
          ls -alh
          ./kdev-build.sh
          ls -alh uboot.img
          sha256sum uboot.img
          cp -a rk3588_spl_loader_v1.21.114.bin RKDevTool_Release_v3.37
          cp -a uboot.img RKDevTool_Release_v3.37
          ls -alh RKDevTool_Release_v3.37
          sudo mkdir -p /builder/release
          sudo zip -r /builder/release/BYD_G98_UBOOT.zip RKDevTool_Release_v3.37

      - name: List build output
        run: |
          ls -alh  /builder/release/*
          md5sum /builder/release/*

      - name: Upload UBOOT to Release
        uses: ncipollo/release-action@main
        with:
          tag: bdy-g98-uboot
          artifacts: /builder/release/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: | # BDY G98 U-Boot

            ## 发布内容
            - **uboot.img** — U-Boot 引导镜像

            ## 适配进展与特性

            | 模块 | 状态 | 说明 |
            | :--- | :---: | :--- |
            | **SATA** | ✅ | 可正常识别 SATA 存储设备 |
            | **NVMe** | ✅ | 双 NVMe M.2 插槽均可识别并启动 |
            | **USB 3.0** | ✅ | 两个 USB 3.0 端口均工作正常 |
            | **启动配置** | ✅ | 支持自动扫描 `boot.scr` 和 `extlinux.conf` |

            ## 免责声明
            - **按原样提供**：镜像不作任何保证，使用风险自负
            - **无官方关联**：与主板厂商无任何关联
            - **安全提示**：请及时更新补丁、修改默认密码、配置防火墙

